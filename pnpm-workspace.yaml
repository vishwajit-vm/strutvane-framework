# drizzle-kit bundles esbuild; its postinstall downloads the platform binary.
allowBuilds:
  esbuild: true
# Our own pre-releases are staged and approved with 2FA (ADR-0018), so they are exempt from
# pnpm's minimum release age; every third-party package keeps the protection.
minimumReleaseAgeExclude:
  - "@strutvane/*"
